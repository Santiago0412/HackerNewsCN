name = "hncn-gateway"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# DEEPSEEK_API_KEY is a secret. Do not put it in this file.
# From this directory, after the KV namespace below exists:
#   npx wrangler secret put DEEPSEEK_API_KEY
# Paste the key when prompted. Wrangler stores it on Cloudflare, not in git.

[vars]
# Optional. The worker ignores any value that is not on https://api.deepseek.com/.
DEEPSEEK_API_URL = "https://api.deepseek.com/chat/completions"

[[kv_namespaces]]
binding = "USAGE_KV"
# Placeholder ids. Replace both after `npx wrangler kv namespace create USAGE_KV`.
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"
