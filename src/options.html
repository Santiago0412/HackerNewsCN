<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hacker News 中文助手设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header><img class="logo" src="../assets/logo.svg" alt=""><div><h1>HN 中文</h1><p>两步完成设置，侧边栏直接阅读。</p></div></header>
    <section class="setup">
      <div class="step"><span>1</span><div><label>选择翻译模型<select id="modelChoice"></select></label></div></div>
      <div id="keyGuide" class="guide"></div>
      <div class="step"><span>2</span><div><label>粘贴 API Key<input id="apiKey" type="password" autocomplete="off" placeholder="在这里粘贴刚刚创建的 Key"></label><button type="button" id="toggleToken" class="secondary">显示 / 隐藏</button></div></div>
      <p class="privacy">🔒 Key 只保存在这台浏览器中，只会发送给你选择的模型服务商。</p>
    </section>
    <section>
      <h2>喜欢的话题 <small>可选</small></h2>
      <p class="hint">选择后会出现在插件阅读器的“关注”Tab；其他 Tab 保持 HN 官方内容与排序。</p>
      <div id="topics" class="topics"></div>
    </section>
    <footer><button id="save" type="button">保存并开始使用</button><span id="status" role="status"></span></footer>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
