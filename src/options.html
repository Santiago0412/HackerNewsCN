<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="optionsTitle">Hacker News AI Reading Assistant settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header><img class="logo" src="../assets/logo.svg" alt=""><div><h1 data-i18n="optionsName">HN Reader</h1><p data-i18n="optionsSubtitle">Choose a language and model.</p></div></header>
    <section class="setup">
      <div class="step"><span>1</span><div class="field-stack"><label><i data-i18n="translateTo">Translate into</i><select id="targetLanguage"></select></label><label id="customLanguageField" hidden><i data-i18n="customLanguage">Target language name</i><input id="customTargetLanguage" type="text" maxlength="80" data-i18n-placeholder="customLanguagePlaceholder"></label></div></div>
      <div class="step"><span>2</span><div><label><i data-i18n="chooseModel">Choose model service</i><select id="modelChoice"></select></label></div></div>
      <div id="customProviderFields" class="custom-fields" hidden>
        <label><i data-i18n="apiUrl">API endpoint</i><input id="customEndpoint" type="url" inputmode="url" autocomplete="url" data-i18n-placeholder="endpointPlaceholder"></label>
        <label><i data-i18n="modelName">Model name</i><input id="customModel" type="text" autocomplete="off" data-i18n-placeholder="modelPlaceholder"></label>
        <p data-i18n="customEndpointPermission">Enter the complete OpenAI-compatible endpoint.</p>
      </div>
      <div id="keyGuide" class="guide"></div>
      <div class="step"><span>3</span><div><label><i data-i18n="apiKey">Paste API key</i><input id="apiKey" type="password" autocomplete="off" data-i18n-placeholder="apiKeyPlaceholder"></label><button type="button" id="toggleToken" class="secondary" data-i18n="showHide">Show / hide</button></div></div>
      <p class="privacy" data-i18n="apiPrivacy">🔒 The endpoint and key stay in this browser.</p>
    </section>
    <section>
      <h2><i data-i18n="favoriteTopics">Favorite topics</i> <small data-i18n="optional">Optional</small></h2>
      <p class="hint" data-i18n="favoriteHint">Selected topics appear in Following.</p>
      <div id="topics" class="topics"></div>
    </section>
    <footer><button id="save" type="button" data-i18n="saveSettings">Save and start</button><span id="status" role="status"></span></footer>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
