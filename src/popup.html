<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HN 中文助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><img src="../assets/logo.svg" alt=""><div><strong>HN 中文</strong><span>智能阅读助手</span></div></div>
    <div class="header-actions">
      <button id="translateCurrentPage" class="page-translate" title="翻译当前打开的网页"><span aria-hidden="true">文A</span><b>译当前页</b></button>
      <button id="settings" class="icon" title="设置" aria-label="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4ZM19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg></button>
    </div>
  </header>
  <section id="onboarding" hidden>
    <div class="welcome"><span>欢迎使用</span><b>先完成简单设置</b><p>选择模型并粘贴 Key，无需注册插件账号。</p></div>
    <label><span>1　选择翻译模型</span><select id="onboardingModel"></select></label>
    <div id="onboardingGuide" class="key-guide"></div>
    <label><span>2　粘贴 API Key</span><input id="onboardingKey" type="password" autocomplete="off" placeholder="粘贴服务商生成的原始 Key"></label>
    <fieldset><legend>3　感兴趣的话题 <small>可选，不选则显示全部</small></legend><div id="onboardingTopics" class="onboarding-topics"></div></fieldset>
    <button id="startReading" class="primary">保存并开始阅读</button>
    <div id="onboardingError" role="alert"></div>
  </section>
  <nav id="feeds" aria-label="新闻分类">
    <button data-feed="favorites">关注</button>
    <button class="active" data-feed="topstories">热门</button>
    <button data-feed="newstories">最新</button>
    <button data-feed="beststories">最佳</button>
    <button data-feed="askstories">问答</button>
    <button data-feed="showstories">作品</button>
  </nav>
  <div id="translationProgress" class="translation-progress" hidden>
    <div><span id="progressLabel">正在翻译…</span><b id="progressText">0%</b></div>
    <progress id="progressBar" max="100" value="0"></progress>
  </div>
  <main id="main">
    <div id="notice" role="status"></div>
    <div id="loading" class="loading"><i></i><span>正在获取 Hacker News…</span></div>
    <ol id="stories"></ol>
    <section id="discussion" hidden>
      <button id="back" class="back">← 返回新闻列表</button>
      <article id="discussionStory"></article>
      <h2>热门讨论</h2>
      <div id="comments"></div>
    </section>
    <section id="articleReader" hidden>
      <button id="articleBack" class="back">← 返回新闻列表</button>
      <article id="articleContent"></article>
    </section>
  </main>
  <footer><button id="refresh">刷新</button><span id="updated"></span></footer>
  <script src="popup.js"></script>
</body>
</html>
